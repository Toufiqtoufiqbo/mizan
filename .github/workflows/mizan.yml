# Mīzān CI - four mandatory stages and one optional job.
#
# A: static + unit        - ruff, formatting, the unit suite
# B: PostgreSQL           - a disposable database, the real round trip.
#                          MIZAN_REQUIRE_POSTGRES makes a skip a failure:
#                          a broken database setup must fail the build, not
#                          quietly remove the only test that proves attribution.
# B2: PostgreSQL lifecycle - destructive cleanup, ownership proof, signals,
#                          orphan recovery and pooled sessions. Separate from B
#                          so a failure in the destructive path is unmistakable.
# C: security regression  - the regression tests and the proof replay. This is
#                          the gate: an attack that works fails the build.
# D: benchmark            - the labelled corpus, reported not asserted.
# S: status summary       - PASSED / FAILED / SKIPPED / NOT CONFIGURED /
#                          NOT EXECUTED for every stage, without inventing a
#                          pass for a job that did not run.
#
# External-target testing is opt-in (see the last job): ordinary CI never
# attacks anything it does not own.

name: mizan

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  FORCE_COLOR: "1"

jobs:
  # --------------------------------------------------------------------------
  # Stage A - static and unit
  # --------------------------------------------------------------------------
  static-and-unit:
    name: "A - static & unit"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Formatting
        run: ruff format --check .

      - name: Unit tests
        run: python -m pytest -q -m "not postgres_integration"

      - name: No skipped tests
        # A skipped unit test is a test that did not run. The stage fails
        # instead of reporting a green build.
        run: |
          python -m pytest -m "not postgres_integration" -rs --tb=no -q | tee unit.txt
          if grep -q "skipped" unit.txt; then
            echo "::error::unit tests were skipped"
            exit 1
          fi

  # --------------------------------------------------------------------------
  # Stage B - PostgreSQL integration
  # --------------------------------------------------------------------------
  postgres-integration:
    name: "B - PostgreSQL"
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: mizan
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      MIZAN_TEST_POSTGRES_DSN: postgresql://postgres:mizan@localhost:5432/postgres
      MIZAN_PG_DSN: postgresql://postgres:mizan@localhost:5432/postgres
      # A missing database fails instead of skipping: the integration suite is
      # the only proof that attribution works.
      MIZAN_REQUIRE_POSTGRES: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: PostgreSQL round trip
        run: python -m pytest -q tests/test_postgres_roundtrip.py

      - name: PostgreSQL ownership evidence integration
        run: python -m pytest -q tests/test_postgres_ownership_integration.py

      - name: PostgreSQL disposable Twin lifecycle
        run: python -m pytest -q tests/test_postgres_twin.py

      - name: PostgreSQL Twin benchmark
        run: python -m benchmarks.postgres_twin.run

      - name: PostgreSQL ownership benchmark and independent checker
        run: python -m benchmarks.postgres_ownership.run

      - name: No skipped tests
        # A skip here means the suite did not run - fail rather than pass.
        run: |
          python -m pytest tests/test_postgres_roundtrip.py tests/test_postgres_ownership_integration.py tests/test_postgres_twin.py -rs --tb=no -q | tee out.txt
          if grep -q "skipped" out.txt; then
            echo "::error::PostgreSQL tests were skipped"
            exit 1
          fi

  # --------------------------------------------------------------------------
  # Stage B2 - PostgreSQL lifecycle and destructive cleanup
  # Everything here creates or deletes a real database, or sends a real signal.
  # --------------------------------------------------------------------------
  postgres-lifecycle:
    name: "B2 - PostgreSQL lifecycle & destructive cleanup"
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: mizan
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      MIZAN_TEST_POSTGRES_DSN: postgresql://postgres:mizan@localhost:5432/postgres
      MIZAN_REQUIRE_POSTGRES: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lifecycle, ownership, signals, pools and orphan recovery
        # Every test in this job is destructive by design: it creates a seed,
        # clones workers, drops them, sends SIGINT/SIGTERM, SIGKILLs a child and
        # recovers it with --cleanup-run. A skip would mean the destructive
        # boundary was never exercised, so the next step fails on any skip.
        run: python -m pytest -q tests/test_postgres_twin.py -m postgres_integration

      - name: No skipped destructive test
        run: |
          python -m pytest tests/test_postgres_twin.py -m postgres_integration -rs --tb=no -q | tee lifecycle.txt
          if grep -q "skipped" lifecycle.txt; then
            echo "::error::a destructive lifecycle test was skipped"
            exit 1
          fi
          if grep -q "no tests ran" lifecycle.txt; then
            echo "::error::the destructive lifecycle tests did not execute"
            exit 1
          fi
          echo "Status: PASSED - destructive lifecycle executed"

  # --------------------------------------------------------------------------
  # Stage C - security regression
  # --------------------------------------------------------------------------
  security-regression:
    name: "C - security regression"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Regression tests
        run: python -m pytest -q tests/test_regression.py

      - name: No skipped tests
        run: |
          python -m pytest tests/test_regression.py -rs --tb=no -q | tee regression.txt
          if grep -q "skipped" regression.txt; then
            echo "::error::regression tests were skipped"
            exit 1
          fi

      - name: Proof replay - an attack reproduces before the fix and is blocked after
        # Self-contained: the benchmark owns a vulnerable application and its
        # patched twin, and the attacks are replayed against both. No external
        # target is needed.
        run: python -m pytest -q tests/test_search_benchmark.py

      - name: Fixed probes against the guided search
        run: python -m mizan.cli compare --size 10

  # --------------------------------------------------------------------------
  # Stage D - benchmark
  # --------------------------------------------------------------------------
  benchmark:
    name: "D - benchmark"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: AuthzBugs (subset)
        run: python -m mizan.cli benchmark --size 10 --controls 2 --out benchmark-report

      - name: Detection rate
        run: |
          python - <<'PY'
          import json, pathlib, sys
          metrics = json.loads(pathlib.Path("benchmark-report/report.json").read_text())["metrics"]
          print(f"detection {metrics['detection_rate']:.0%}, false positives {metrics['false_positives_on_patched_apps']}")
          if metrics["detection_rate"] < 0.9 or metrics["false_positives_on_patched_apps"] > 0:
              print("::error::benchmark regressed", metrics)
              sys.exit(1)
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-report
          path: benchmark-report/

  # --------------------------------------------------------------------------
  # Stage E - Mizan scans Mizan
  # --------------------------------------------------------------------------
  self-scan:
    name: "E - Mizan scans Mizan"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: The clean API must be clean, the weakened one must not be
        run: python -m mizan.cli self-scan

  # --------------------------------------------------------------------------
  # Stage F - independent application validation
  # --------------------------------------------------------------------------
  independent-validation:
    name: "F - independent application"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: A standalone application that knows nothing about Mizan
        # The application has its own authentication, its own database and its
        # own OpenAPI document. Every variant is exercised:
        #   clean      -> no finding
        #   read       -> L2 only
        #   write      -> L3 only
        #   both       -> L2 and L3
        run: python -m pytest -q tests/test_external_validation.py

      - name: The expected behaviour, spelled out
        run: python -m mizan.cli validate tests/fixtures/external_apps/flask_store

      - name: The gate must not skip
        run: |
          python -m pytest tests/test_external_validation.py -rs --tb=no -q | tee out.txt
          if grep -q "skipped" out.txt; then
            echo "::error::the independent validation was skipped"
            exit 1
          fi

  # --------------------------------------------------------------------------
  # Stage G - cross-framework validation gate
  # One validation engine, three independently implemented fixtures.
  # The launch contract, the FastAPI and Express suites, the benchmark and
  # its independent checker all run here. A skipped mandatory suite fails
  # the job; an environment failure is never reported as a passing test.
  # --------------------------------------------------------------------------
  cross-framework:
    name: "G - cross-framework gate"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Record the runtimes
        run: |
          python --version
          node --version
          npm --version

      - name: Install
        run: pip install -e ".[dev]"

      - name: Install the Express fixture's dependencies from the lockfile
        # The benchmark needs the fixture's own dependencies. It must not depend
        # on another step having installed them: `npm ci` installs exactly what
        # package-lock.json pins and never touches the lockfile.
        run: npm ci --no-audit --no-fund
        working-directory: tests/fixtures/external_apps/express_store

      - name: The launch contract
        run: python -m pytest -q tests/test_validation_launch.py tests/test_validation_fail_closed.py

      - name: The FastAPI fixture suite
        run: python -m pytest -q tests/test_fastapi_validation.py

      - name: The Express fixture suite
        run: python -m pytest -q tests/test_express_validation.py

      - name: No skipped tests in the cross-framework gate
        run: |
          python -m pytest tests/test_validation_launch.py tests/test_validation_fail_closed.py tests/test_fastapi_validation.py tests/test_express_validation.py -rs --tb=no -q | tee cross.txt
          if grep -q "skipped" cross.txt; then
            echo "::error::a cross-framework suite was skipped"
            exit 1
          fi

      - name: The cross-framework benchmark (2 frameworks x 4 variants x 3 repetitions)
        # --output names the DIRECTORY that receives results.json and results.md.
        run: python -m benchmarks.cross_framework.run --repetitions 3 --output benchmarks/cross_framework/results

      - name: The independent checker rejects nothing less than the expected matrix
        run: python -m benchmarks.cross_framework.check benchmarks/cross_framework/results/results.json

      - name: Upload the benchmark results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cross-framework-results
          path: benchmarks/cross_framework/results/

  # --------------------------------------------------------------------------
  # Opt-in: an external target.
  # Never part of ordinary CI: it needs an explicit variable and its own tokens.
  # --------------------------------------------------------------------------
  external-target:
    name: "G - external target (opt-in)"
    if: vars.MIZAN_TARGET != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e .

      - name: Replay every proven attack against the target
        env:
          MIZAN_TARGET: ${{ vars.MIZAN_TARGET }}
          MIZAN_TOKENS: ${{ secrets.MIZAN_TOKENS }}
        run: |
          python -m mizan.cli replay mizan-proofs --target "$MIZAN_TARGET"

  # --------------------------------------------------------------------------
  # Status summary - never turns a non-run into a pass.
  # A conditional external target is NOT CONFIGURED when the variable is
  # empty; if it is configured but the job did not execute, NOT EXECUTED.
  # --------------------------------------------------------------------------
  status-summary:
    name: "S - status summary"
    if: always()
    needs:
      - static-and-unit
      - postgres-integration
      - postgres-lifecycle
      - security-regression
      - benchmark
      - self-scan
      - independent-validation
      - cross-framework
      - external-target
    runs-on: ubuntu-latest
    env:
      MIZAN_TARGET_CONFIGURED: ${{ vars.MIZAN_TARGET != '' }}
    steps:
      - name: Report every stage honestly
        env:
          A: ${{ needs.static-and-unit.result }}
          B: ${{ needs.postgres-integration.result }}
          B2: ${{ needs.postgres-lifecycle.result }}
          C: ${{ needs.security-regression.result }}
          D: ${{ needs.benchmark.result }}
          E: ${{ needs.self-scan.result }}
          F: ${{ needs.independent-validation.result }}
          G: ${{ needs.cross-framework.result }}
          G_EXTERNAL: ${{ needs.external-target.result }}
        run: |
          python - <<'PY'
          import os

          def state(result: str) -> str:
              return {
                  "success": "PASSED",
                  "failure": "FAILED",
                  "cancelled": "FAILED",
                  "skipped": "SKIPPED",
              }.get(result or "skipped", "NOT EXECUTED")

          rows = [
              ("A - static & unit", state(os.environ["A"])),
              ("B - PostgreSQL", state(os.environ["B"])),
              ("B2 - PostgreSQL lifecycle & destructive cleanup", state(os.environ["B2"])),
              ("C - security regression", state(os.environ["C"])),
              ("D - benchmark", state(os.environ["D"])),
              ("E - self-scan", state(os.environ["E"])),
              ("F - independent application", state(os.environ["F"])),
              ("G - cross-framework gate", state(os.environ["G"])),
          ]
          if os.environ["MIZAN_TARGET_CONFIGURED"] != "true":
              rows.append(("G - external target (opt-in)", "NOT CONFIGURED"))
          else:
              rows.append(("G - external target (opt-in)", state(os.environ["G_EXTERNAL"])))

          print("| Stage | Status |")
          print("|---|---|")
          for name, value in rows:
              print(f"| {name} | {value} |")
          if any(value in {"FAILED", "NOT EXECUTED"} for _, value in rows):
              raise SystemExit("a mandatory stage did not pass")
          PY
