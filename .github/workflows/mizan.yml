name: mizan

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  self-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Tests
        run: python -m pytest -q
      - name: Benchmark (subset)
        run: python -m mizan.cli benchmark --size 10 --controls 2 --out benchmark-report

  attack-regression:
    # Replays the proven attacks against a running target.
    # Configure the target with the repository secrets MIZAN_TARGET and
    # MIZAN_TOKEN_<IDENTITY>.
    runs-on: ubuntu-latest
    if: ${{ vars.MIZAN_TARGET != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e .
      - name: Replay every proof bundle
        run: |
          set -e
          for bundle in mizan-proofs/*/; do
            echo "::group::$bundle"
            mizan verify "$bundle" --target "$MIZAN_TARGET" --expect-fixed
            echo "::endgroup::"
          done
