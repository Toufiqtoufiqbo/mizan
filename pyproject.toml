[project]
name = "mizan"
version = "0.1.0"
description = "Mizan - law-driven API security testing. Write-side taint, authority creation, TOCTOU races and reproducible proof bundles, built on top of Schemathesis."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Mizan contributors" }]
keywords = ["security", "api", "pentest", "authorization", "idor", "mass-assignment", "toctou", "schemathesis"]
classifiers = ["License :: OSI Approved :: MIT License", "Programming Language :: Python :: 3"]
dependencies = ["schemathesis>=4.33", "click>=8.0", "requests>=2.28"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "psycopg[binary]>=3.1", "fastapi>=0.110", "uvicorn>=0.27", "httpx>=0.27"]

[project.scripts]
mizan = "mizan.cli:main"

[project.entry-points.pytest11]
mizan = "mizan.pytest_plugin"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "postgres_integration: needs a real PostgreSQL server (MIZAN_TEST_POSTGRES_DSN)",
]


[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "W"]
